apiVersion: apps/v1
kind: Deployment
metadata:
  name: static
  labels:
    app: static
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static
  template:
    metadata:
      labels:
        app: static
    spec:
      containers:
        - name: static
          image: caddy:alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: static-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            # The disk folders are not the same as the URLs
            - name: data
              mountPath: /srv/static/products
              subPath: products
            - name: data
              mountPath: /srv/static/banners
              subPath: banners
            - name: data
              mountPath: /srv/static/invoices
              subPath: invoices
            - name: data
              mountPath: /srv/static/payouts
              subPath: payout_requests
            - name: data
              mountPath: /srv/static/sellerPayouts
              subPath: seller_payouts
            - name: data
              mountPath: /srv/static/writeOffs
              subPath: write_offs
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: static-config
          configMap:
            name: static-config
        - name: data
          persistentVolumeClaim:
            claimName: sudosos-data
